name: daily-scan

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [watchlist.json]

permissions:
  contents: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scan.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit data
        run: |
          git config user.name "bounty-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data: scan $(date -u +%F)"
          # Data files are regenerated every run, so on a race prefer THIS run's fresh data.
          for i in 1 2 3; do
            git fetch -q origin main
            git merge -X ours -m "merge concurrent scan" origin/main || git merge --abort || true
            git push && break || sleep $((RANDOM % 10 + 3))
          done
      - name: Open alert issue
        if: hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat alert_title.txt)" --body-file alert.md
      - name: Open daily scope digest issue
        if: hashFiles('digest.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat digest_title.txt)" --body-file digest.md
      - name: Open new in-scope digest issue
        if: hashFiles('inscope.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat inscope_title.txt)" --body-file inscope.md
