<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bounty-watch</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
</head>
<body>
<main>
<header>
  <h1>🛰️ bounty-watch</h1>
  <span><a class="navlink" href="scope.html">Scope changes dashboard →</a> · <span class="mut" id="meta">loading…</span></span>
</header>
<nav id="tabs">
  <button data-t="new" class="on">New programs</button>
  <button data-t="features">🔥 New features</button>
  <button data-t="inscope">➕ New in-scope</button>
  <button data-t="feed">Changes feed</button>
  <button data-t="all">All programs</button>
  <button data-t="recent">Recently updated</button>
  <button data-t="hunt">🎯 Hunt score</button>
  <button data-t="selfhosted">🏴 Self-hosted</button>
  <button data-t="paused">Paused / resumed</button>
  <button data-t="watch">Watchlist</button>
  <button data-t="settings">Settings</button>
</nav>
<div class="bar" id="bar">
  <input type="search" id="q" placeholder="Filter by name, handle, asset…">
  <select id="plat"><option value="">All platforms</option><option value="h1">HackerOne</option><option value="bc">Bugcrowd</option><option value="ywh">YesWeHack</option><option value="it">Intigriti</option></select>
  <select id="kind"><option value="">All change types</option><option>new</option><option>suspended</option><option>resumed</option><option>scope+</option><option>scope-</option><option>deploy</option><option>subdomain</option><option>feature</option><option>changelog</option><option>live-host</option><option>takeover</option><option>appversion</option></select>
  <select id="stype" title="Programs whose scope includes this asset type"></select>
  <select id="sort"><option value="first">Newest programs first</option><option value="upd">Recently updated first</option><option value="bounty">Highest bounty</option><option value="name">Name A–Z</option></select>
  <select id="since"><option value="">Any time</option><option value="1">Last 24h</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option></select>
  <label class="mut"><input type="checkbox" id="mine"> watchlist only</label>
</div>
<div id="out"></div>
<button id="more" hidden>Show more</button>
</main>
<script>
const REPO = "abdulsalam-create/bounty-watch";
const PNAME = {h1:"HackerOne",bc:"Bugcrowd",ywh:"YesWeHack",it:"Intigriti"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch{}}};
let P = {}, PZ = {}, F = [], W = [], SH = {programs:[]}, wSha = null, tab = "new", limit = 100;

async function init(){
  const bust = "?v=" + Date.now();
  const [p, f, sh] = await Promise.all([fetch("data/programs.json"+bust).then(r=>r.json()), fetch("data/changes.json"+bust).then(r=>r.json()).catch(()=>[]), fetch("data/selfhosted.json"+bust).then(r=>r.json()).catch(()=>({programs:[]}))]);
  P = p.programs; PZ = p.paused || {}; F = f; SH = sh;
  $("#meta").textContent = `${Object.keys(P).length} programs · updated ${p.updated.replace("T"," ")} UTC`;
  await loadWatch();
  const h = (location.hash || "").slice(1);
  if(["features","inscope","feed","all","recent","hunt","paused","watch","selfhosted"].includes(h)){
    tab = h; document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.t===h));
  }
  render();
}
async function loadWatch(){
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/watchlist.json`, {headers: auth(), cache:"no-store"});
    const j = await r.json(); wSha = j.sha; W = JSON.parse(atob(j.content.replace(/\n/g,"")));
  }catch{ W = await fetch("https://raw.githubusercontent.com/"+REPO+"/main/watchlist.json").then(r=>r.json()).catch(()=>[]); }
}
function auth(){ const t = ls.get("bw_pat"); return t ? {Authorization: "Bearer "+t} : {}; }
async function toggle(k){
  const t = ls.get("bw_pat");
  if(!t){ alert("Add a GitHub token in Settings to edit the watchlist from here, or edit watchlist.json on GitHub."); return; }
  const next = W.includes(k) ? W.filter(x=>x!==k) : [...W, k].sort();
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/watchlist.json`, {method:"PUT", headers:{...auth(),"Content-Type":"application/json"},
    body: JSON.stringify({message:`watchlist: ${W.includes(k)?"remove":"add"} ${k}`, content: btoa(JSON.stringify(next,null,1)+"\n"), sha: wSha})});
  if(!r.ok){ alert("GitHub API error "+r.status+": "+(await r.text()).slice(0,200)); return; }
  wSha = (await r.json()).content.sha; W = next; render();
}
function match(k, extra){
  const q = $("#q").value.trim().toLowerCase(), pl = $("#plat").value;
  if(pl && !k.startsWith(pl+":")) return false;
  if($("#mine").checked && !W.includes(k)) return false;
  const st = $("#stype").value; if(st && !typeMatch(P[k]?.scope || [], st)) return false;
  return !q || (k + " " + extra).toLowerCase().includes(q);
}
function progRow(k, p, note){
  const on = W.includes(k);
  const sc = (p?.scope||[]);
  return `<div class="row"><div class="top"><a href="${esc(p?.url)}" target="_blank" rel="noopener">${esc(p?.name||k)}</a>
    <span class="tag">${PNAME[k.split(":")[0]]}</span><span class="tag">${esc(k)}</span>
    ${p?.bounty ? `<span class="tag t-new">${p.bounty>1?"$"+p.bounty.toLocaleString():"bounty"}</span>`:`<span class="tag">VDP</span>`}
    <button class="star" data-k="${esc(k)}">${on?"★ watching":"☆ watch"}</button></div>
    <div class="x">${p?.first?`Added ${esc(p.first)}`:"Added before tracking"}${p?.upd?` · Updated ${esc(p.upd)}`:""}</div>
    ${note?`<div class="x">${esc(note)}</div>`:""}
    ${sc.length?`<details><summary>${sc.length} in-scope assets · ${typeSummary(sc)}</summary><ul>${sc.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></details>`:""}</div>`;
}
function chips(label, arr, cls){
  return (arr && arr.length) ? `<div class="chips"><span class="mut">${label}:</span>${arr.map(a=>`<code class="chip ${cls}">${esc(a)}</code>`).join("")}</div>` : "";
}
function endpointChips(arr, live){
  if(!arr || !arr.length) return "";
  live = live || {};
  const items = arr.map(e=>{
    const qualified = e.includes("/") && e.split("/")[0].includes(".");  // has a real host
    if(!qualified) return `<code class="chip ep" title="path only; host unknown">${esc(e)}</code>`;
    const url = "https://" + e, st = live[e];
    const badge = st ? `<span class="stbadge s${String(st)[0]}">${st}</span>` : "";
    return `<a class="chip ep" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(url)}">${esc(e)}${badge}</a>`;
  }).join("");
  return `<div class="chips"><span class="mut">new endpoints:</span>${items}</div>`;
}
function jsLinks(arr){
  if(!arr || !arr.length) return "";
  return `<div class="chips"><span class="mut">new JS files:</span>${arr.map(u=>{
    const name = esc(u.split("?")[0].split("/").pop());
    return `<a class="chip js" href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">${name}</a>`;
  }).join("")}</div>`;
}
function evRow(e){
  // new-feature events carry the actual new endpoints / GraphQL ops / feature flags, plus the new JS files
  const feat = e.t === "feature" ? endpointChips(e.api, e.live) + chips("GraphQL", e.gql, "gql") + chips("feature flags", e.flags, "flag") + jsLinks(e.js)
    : e.t === "deploy" ? jsLinks(e.js)
    : (e.t === "subdomain" || e.t === "live-host") ? chips(e.t === "live-host" ? "live" : "new subdomains", e.hosts || e.subs, "sub") : "";
  const detail = e.t === "feature" ? `<div class="x"><b>New features detected</b> from a changed JS bundle</div>` : `<div class="x">${esc(e.x)}</div>`;
  return `<div class="row"><div class="top"><span class="tag t-${esc(e.t)}">${esc(e.t)}</span><a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.n)}</a>
    <span class="tag">${esc(e.k)}</span><span class="mut">${esc(e.d)}</span>
    <button class="star" data-k="${esc(e.k)}">${W.includes(e.k)?"★":"☆"}</button></div>${detail}${feat}</div>`;
}
function cutoff(){ const d = +$("#since").value; return d ? new Date(Date.now()-d*864e5).toISOString().slice(0,10) : ""; }
function render(){
  $("#bar").hidden = tab === "settings";
  $("#kind").hidden = tab !== "feed";
  $("#sort").hidden = !["all","watch","recent"].includes(tab);
  $("#stype").hidden = ["feed","settings","paused","selfhosted"].includes(tab);
  let html = [];
  if(tab === "settings"){
    html = [`<div class="row"><b>Watchlist editing</b><p class="mut">Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a> with access to <code>${REPO}</code> only and <i>Contents: Read and write</i>. It is stored only in this browser.</p>
      <input type="password" id="pat" placeholder="github_pat_…" value="${esc(ls.get("bw_pat")||"")}" style="width:100%"><p><button id="savepat" class="star" style="margin:0">Save token</button></p>
      <p class="mut">No token? Edit <a href="https://github.com/${REPO}/edit/main/watchlist.json" target="_blank" rel="noopener">watchlist.json</a> directly. Keys look like <code>h1:handle</code>, <code>bc:slug</code>, <code>ywh:slug</code>, <code>it:company/handle</code>.</p>
      <p class="mut">Run a scan now: <a href="https://github.com/${REPO}/actions/workflows/scan.yml" target="_blank" rel="noopener">Actions → daily-scan → Run workflow</a>.</p></div>`];
  } else if(tab === "selfhosted"){
    const since = cutoff(), q = $("#q").value.trim().toLowerCase(), pl = $("#plat").value;
    let list = (SH.programs || []).filter(r => (!since || (r.first||"") >= since)
      && !pl && (!q || (r.name+" "+r.domain+" "+(r.rewards||[]).join(" ")+" "+r.submit).toLowerCase().includes(q)));
    html.push(`<p class="mut">Independent programs off HackerOne/Bugcrowd/YesWeHack/Intigriti, each verified to publish a concrete reward table and a way to submit. ${(SH.programs||[]).length} found${SH.queued?`, ${SH.queued} more queued for checking`:""}. Emailed as new ones appear.</p>`);
    list.slice(0, limit).forEach(r => {
      const rewards = (r.rewards||[]).map(x=>`<code class="chip ep">${esc(x)}</code>`).join("");
      const submit = /@/.test(r.submit) && !/\s/.test(r.submit) ? `<a class="navlink" href="mailto:${esc(r.submit)}">${esc(r.submit)}</a>` : esc(r.submit);
      html.push(`<div class="row"><div class="top"><a href="${esc(r.policy)}" target="_blank" rel="noopener">${esc(r.name)}</a>
        <span class="tag">${esc(r.domain)}</span><span class="tag t-new">self-hosted</span>
        ${r.sla?`<span class="tag t-feature">SLA</span>`:""}<span class="mut">found ${esc(r.first)}</span></div>
        <div class="chips"><span class="mut">rewards:</span>${rewards}</div>
        <div class="x">submit: ${submit}${r.sla?` · SLA: ${esc(r.sla)}`:""} · <span class="mut">via ${esc(r.source)}</span></div>
        <div class="x"><a class="navlink" href="${esc(r.policy)}" target="_blank" rel="noopener">policy →</a></div></div>`);
    });
    if(!list.length) html.push(`<div class="empty">No self-hosted programs match yet. The list builds up over successive scans as candidates are verified.</div>`);
    $("#more").hidden = list.length <= limit;
  } else if(tab === "paused"){
    const since = cutoff(), flap = m => (m.flips||0) >= 3 ? `<span class="tag t-suspended">flapping · paused ${m.flips}×</span>` : "";
    const gone = Object.entries(PZ).filter(([k,m]) => (!since || m.gone >= since) && match(k, m.n||"")).sort((a,b)=>b[1].gone.localeCompare(a[1].gone));
    const back = Object.keys(P).filter(k => P[k].back && (!since || P[k].back >= since) && match(k, P[k].name)).sort((a,b)=>P[b].back.localeCompare(P[a].back));
    html.push(`<h3>Currently paused (${gone.length})</h3><p class="mut">Programs that dropped off the public list: suspended, paused, gone private or closed.</p>`);
    gone.slice(0, limit).forEach(([k,m]) => html.push(`<div class="row"><div class="top"><span class="tag t-suspended">paused</span><a href="${esc(m.u)}" target="_blank" rel="noopener">${esc(m.n||k)}</a><span class="tag">${PNAME[k.split(":")[0]]}</span><span class="tag">${esc(k)}</span>${flap(m)}<span class="mut">since ${esc(m.gone)}</span></div></div>`));
    html.push(`<h3>Recently resumed (${back.length})</h3><p class="mut">Programs that came back after a pause. These are not counted as new programs.</p>`);
    back.slice(0, limit).forEach(k => html.push(progRow(k, P[k], `Resumed ${P[k].back}${P[k].gap!=null?` after ${P[k].gap} day(s) paused`:""}`).replace('<div class="top">', `<div class="top">${flap(P[k])}`)));
    $("#more").hidden = Math.max(gone.length, back.length) <= limit;
  } else if(tab === "hunt"){
    const since = cutoff();
    const parts = {fresh:"freshness",momentum:"new-surface momentum",surface:"attack surface",reward:"reward",unsaturated:"low saturation"};
    const keys = Object.keys(P).filter(k => P[k].hunt!=null && (!since || (P[k].upd||P[k].first||"") >= since)
      && (!$("#stype").value || typeMatch(P[k].scope||[], $("#stype").value)) && match(k, P[k].name+" "+P[k].scope.join(" ")));
    keys.sort((a,b)=>P[b].hunt-P[a].hunt);
    if(!$("#q").value && !since) html.push(`<p class="mut">Ranked by likelihood of fresh, under-hunted attack surface; recency and new-scope momentum weigh most. ${keys.length} scored programs.</p>`);
    keys.slice(0, limit).forEach(k => {
      const p = P[k], pr = p.parts||{};
      const bars = Object.keys(parts).map(f=>`<span>${parts[f]} ${Math.round((pr[f]||0)*100)}%</span>`).join("");
      html.push(progRow(k, p, (p.hy||[]).join(" · ")).replace('</details>', `</details>`).replace('<div class="x">', `<div class="parts">${bars}</div><div class="x">`));
    });
    $("#more").hidden = keys.length <= limit;
  } else if(tab === "all" || tab === "watch" || tab === "recent"){
    const srt = $("#sort").value, since = cutoff(), fld = srt === "first" ? "first" : "upd";
    const keys = Object.keys(P).filter(k => (tab!=="watch" || W.includes(k)) && (tab!=="recent" || P[k].upd)
      && (!since || (P[k][fld]||"") >= since) && match(k, P[k].name+" "+P[k].scope.join(" ")));
    const by = {first:(a,b)=>(P[b].first||"").localeCompare(P[a].first||""), upd:(a,b)=>(P[b].upd||"").localeCompare(P[a].upd||""),
      bounty:(a,b)=>P[b].bounty-P[a].bounty, name:()=>0}[srt];
    keys.sort((a,b)=>by(a,b)||P[a].name.localeCompare(P[b].name));
    if(tab==="watch") W.filter(k=>!P[k]).forEach(k=>html.push(progRow(k,null,"Not found in current data (closed or wrong key)")));
    keys.slice(0, limit).forEach(k=>html.push(progRow(k,P[k])));
    $("#more").hidden = keys.length <= limit;
  } else if(tab === "features"){
    const since = cutoff();
    const ev = F.filter(e => (e.t==="feature"||e.t==="takeover") && (!since || e.d >= since)
      && (!$("#plat").value || e.k.startsWith($("#plat").value+":")) && (!$("#mine").checked || W.includes(e.k))
      && match(e.k, e.n+" "+e.x));
    if(!$("#q").value) html.push(`<p class="mut">New code features (endpoints, GraphQL ops, feature flags) and takeovers spotted on watchlist programs. This is the freshest, least-hunted attack surface. ${ev.length} in range.</p>`);
    ev.slice(0, limit).forEach(e => html.push(evRow(e)));
    if(!ev.length) html.push(`<div class="empty">No new features yet. Add programs to your ★ Watchlist; features are detected from their JS bundles on each scan.</div>`);
    $("#more").hidden = ev.length <= limit;
  } else if(tab === "inscope"){
    const since = cutoff();
    const ev = F.filter(e => e.t==="scope+" && (e.f==="scope" || (!e.f && !e.x.startsWith("out-of-scope")))
      && (!since || e.d >= since) && (!$("#plat").value || e.k.startsWith($("#plat").value+":"))
      && (!$("#mine").checked || W.includes(e.k)) && match(e.k, e.n+" "+(e.a||[]).join(" ")));
    if(!$("#q").value) html.push(`<p class="mut">Programs that added new <b>in-scope</b> targets, newest first. ${ev.length} additions in range. Emailed daily.</p>`);
    ev.slice(0, limit).forEach(e => {
      const b = P[e.k]?.bounty || e.b || 0;
      html.push(`<div class="row"><div class="top"><span class="tag t-scope+">➕ in-scope</span><a href="${esc(e.u)}" target="_blank" rel="noopener">${esc(e.n)}</a>
        <span class="tag">${PNAME[e.k.split(":")[0]]}</span><span class="tag">${esc(e.k)}</span>
        ${b?`<span class="tag t-new">${b>1?"$"+b.toLocaleString():"bounty"}</span>`:`<span class="tag">VDP</span>`}
        <span class="mut">${esc(e.d)}</span><button class="star" data-k="${esc(e.k)}">${W.includes(e.k)?"★":"☆"}</button></div>
        ${chips("new in-scope", e.a || [e.x.replace(/^scope added: /,"")], "sub")}</div>`);
    });
    $("#more").hidden = ev.length <= limit;
  } else {
    const kind = tab==="new" ? "new" : $("#kind").value;
    const since = cutoff();
    const ev = F.filter(e => (!kind || e.t===kind) && (!since || e.d >= since) && match(e.k, e.n+" "+e.x));
    ev.slice(0, limit).forEach(e => html.push(tab==="new" ? progRow(e.k, P[e.k], `Launched ${e.d}`) : evRow(e)));
    $("#more").hidden = ev.length <= limit;
  }
  $("#out").innerHTML = html.join("") || `<div class="empty">Nothing here yet. ${tab==="new"||tab==="feed"?"Changes appear after the second daily scan.":""}</div>`;
}
$("#tabs").onclick = e => { const t = e.target.dataset.t; if(!t) return; tab = t; limit = 100; if(t==="recent") $("#sort").value = "upd"; if(t==="all") $("#sort").value = "first";
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.t===t)); render(); };
["#q","#plat","#kind","#mine","#sort","#since","#stype"].forEach(s => $(s).addEventListener("input", ()=>{limit=100; render();}));
$("#more").onclick = () => { limit += 200; render(); };
$("#out").onclick = e => {
  const s = e.target.closest(".star[data-k]"); if(s) return toggle(s.dataset.k);
  if(e.target.id === "savepat"){ ls.set("bw_pat", $("#pat").value.trim()); loadWatch().then(()=>{alert("Saved."); render();}); }
};
$("#stype").innerHTML = typeOptions("Any scope type");
init().catch(e => { $("#meta").textContent = "Failed to load data: " + e; });
</script>
</body>
</html>
